[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specenv"
version = "0.3.0"
description = "Zero-dependency typed environment variable loader for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Abhijat Chaturvedi", email = "abhijatchaturvedi@gmail.com" },
]
keywords = ["env", "environment", "config", "settings", "cast", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage   = "https://github.com/abhijatchaturvedi/envspec"
Repository = "https://github.com/abhijatchaturvedi/envspec"
Issues     = "https://github.com/abhijatchaturvedi/envspec/issues"

[tool.hatch.build.targets.wheel]
packages = ["specenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
